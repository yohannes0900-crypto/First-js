<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        body{
            font-family: arial,sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input{
            padding: 10px;
            font-size: 16px;
            width: 250px;
        }
        button{
            padding: 10x 20px;
            font-size: 16px;
            cursor: pointer;
        }
        ul{
            list-style-type:none;
            padding: 0;
            max-width: 300px;
            margin: 20px auto;
            text-align: left;
        }
        li{
            padding: 8px;
            background: #f4f4f4;
            margin-bottom: 5px;
            border-radius: 4px;
        }
    </style>

</head>
<body>
    <h1>My To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter a new task...">
    <button id="addBtn">Add Task</button>

    <ul id="taskList"></ul>
    <script src="todo.js"></script>
</body>
</html>
